[project]
name = "shipping-rag"
version = "0.1.0"
description = "Advanced shipping PDF RAG with FastAPI, Next.js and Langfuse"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "langchain-core>=0.3.79,<1",
  "langfuse>=3,<5",
  "pypdf>=5,<7",
  "rank-bm25>=0.2.2,<1",
  "tiktoken>=0.9,<1",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2",
  "ragas==0.3.9",
  "transformers>=4.51,<6",
  "accelerate>=1,<2",
  "torch>=2.7",
  "langchain>=0.3.27,<0.4",
  "langchain-community>=0.3.29,<0.4",
  "langchain-openai>=0.3.30,<0.4",
  "ollama>=0.5,<1",
]

[project.optional-dependencies]
memory = ["mem0ai>=1,<2"]
reranker = ["transformers>=4.51,<6", "torch>=2.7", "accelerate>=1,<2"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# 이 프로젝트는 설치형 패키지가 아니라서 저장소 루트를 직접 import 경로에 넣어야
# backend/ scripts/ evaluation/ 모듈을 테스트에서 import할 수 있다.
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

